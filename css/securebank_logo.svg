<svg width="320" height="52" viewBox="0 0 320 52" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SecureBank logo</title>
  <desc>SecureBank white logo for dark/red backgrounds</desc>

  <style>
    .brand-name { font-family: Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #ffffff; letter-spacing: -0.3px; }
    .brand-tag  { font-family: Arial, sans-serif; font-size: 6.5px; font-weight: 400; fill: rgba(255,255,255,0.75); letter-spacing: 1.5px; }
    .divider    { stroke: rgba(255,255,255,0.4); stroke-width: 0.75px; }
  </style>

  <!-- Shield -->
  <path d="M26 2 L46 9 L46 27 Q46 42 26 50 Q6 42 6 27 L6 9 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Pillars -->
  <line x1="18" y1="16" x2="18" y2="37" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="26" y1="12" x2="26" y2="40" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="34" y1="16" x2="34" y2="37" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Top bar -->
  <line x1="14" y1="16" x2="38" y2="16" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bottom bar -->
  <line x1="15" y1="37" x2="37" y2="37" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="58" y1="4" x2="58" y2="48" class="divider"/>

  <!-- Wordmark -->
  <text x="68" y="29" class="brand-name">SecureBank</text>
  <text x="69" y="41" class="brand-tag">TRUSTED · SECURE · RELIABLE</text>
</svg>
